name: CI/CD Pipeline Frontend

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, stage]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: '24'
  DOCKER_USERNAME: djmaldonado19
  DOCKER_IMAGE: restaurante-ops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Type-check, build and prerender
        run: npm run build

  docker-push:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.run_number }}
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dev toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:dev
          cache-from: type=gha

  deploy:
    needs: docker-push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY:         ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_USER:     ${{ secrets.SERVER_USER }}
          SERVER_HOST:     ${{ secrets.SERVER_HOST }}
          REPO_PATH:       ${{ secrets.REPO_PATH }}
          API_BASE_URL:    ${{ secrets.API_BASE_URL }}
          IMAGE_TAG:       ${{ github.run_number }}
        run: |
          set -eu

          API_BASE_URL="${API_BASE_URL:-http://$SERVER_HOST:8080}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          {
            printf 'IMAGE_TAG=%s\n'    "$IMAGE_TAG"
            printf 'API_BASE_URL=%s\n' "$API_BASE_URL"
          } > env.deploy

          scp -i ~/.ssh/deploy_key env.deploy "$SERVER_USER@$SERVER_HOST:$REPO_PATH/.env"

          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "
              set -eu
              cd '$REPO_PATH'
              git pull origin master
              docker compose -f compose-prod.yaml pull
              docker compose -f compose-prod.yaml up -d --remove-orphans --wait --wait-timeout 180
              docker image prune -f
            "
